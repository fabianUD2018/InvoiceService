name: build-and-test.yml
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: store jar file
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: build/libs/InvoiceService-0.0.1-SNAPSHOT.jar
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: jar-file
          path: build/libs/InvoiceService-0.0.1-SNAPSHOT.jar
      - name: build docker image
        run: docker build -t invoice_service:${{ github.sha }} .
      - name: run compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d
      - name: run smoke test
        run: ./gradlew clean smokeTests
      - name: stop compose
        if: always()
        run: docker compose down
